<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Site editor — Panafrica Distributors</title>
<meta name="robots" content="noindex" />
<style>
@import url('https://fonts.googleapis.com/css2?family=Syne:wght@600;700;800&family=Source+Serif+4:opsz,wght@8..60,400;8..60,600&display=swap');
:root{
  --paper:#eef1ec;
  --paper-2:#e4e8e2;
  --ink:#101614;
  --ink-70:rgba(16,22,20,.72);
  --line:rgba(16,22,20,.14);
  --teal:#1c4a4a;
  --teal-logo:#3e837d;
  --dark:#101414;
  --on-dark:#e9e7e2;
  --danger:#8a3a2a;
  --radius:10px;
  --pad:20px;
  --font-display:'Syne',system-ui,sans-serif;
  --font-body:'Source Serif 4',Georgia,serif;
}
*{ box-sizing:border-box; margin:0; padding:0; }
html{ scroll-behavior:smooth; scroll-padding-top:96px; }
body{ background:var(--paper); color:var(--ink); font-family:var(--font-body); font-size:16px; line-height:1.55; }
button,input,textarea{ font:inherit; color:inherit; }
button{ cursor:pointer; }
a{ color:var(--teal); }
:where(a,button,input,textarea):focus-visible{ outline:2px solid var(--teal-logo); outline-offset:2px; }

.top{ position:sticky; top:0; z-index:20; background:rgba(238,241,236,.92); backdrop-filter:blur(10px);
  padding:18px var(--pad) 14px; border-bottom:1px solid var(--line); }
.top h1{ font-family:var(--font-display); font-size:1.35rem; letter-spacing:-.03em; }
.back{ display:inline-block; font-family:var(--font-display); font-size:.72rem; letter-spacing:.16em;
  text-transform:uppercase; text-decoration:none; color:var(--teal); margin-bottom:6px; }
.server-flag{ font-size:.85rem; color:var(--ink-70); margin-top:6px; max-width:62ch; }

.layout{ display:grid; grid-template-columns:1fr; gap:0; }
@media (min-width:960px){
  .layout{ grid-template-columns:220px minmax(0,1fr); }
  .toc{ position:sticky; top:88px; height:calc(100vh - 88px); overflow:auto; padding:24px var(--pad); }
}
.toc{ display:flex; flex-direction:column; gap:4px; padding:16px var(--pad); border-bottom:1px solid var(--line); }
@media (min-width:960px){ .toc{ border-bottom:none; border-right:1px solid var(--line); } }
.toc a{ font-family:var(--font-display); font-size:.78rem; letter-spacing:.12em; text-transform:uppercase;
  text-decoration:none; color:var(--ink-70); padding:8px 0; min-height:44px; display:flex; align-items:center; }
.toc a:hover{ color:var(--teal); }

.main{ padding:8px var(--pad) 140px; }
.panel{ padding:36px 0 12px; border-top:1px solid var(--line); }
.panel h2{ font-family:var(--font-display); font-size:1.7rem; letter-spacing:-.03em; margin-bottom:18px; }
.lede{ font-size:.95rem; color:var(--ink-70); margin:18px 0 10px; }
.grid{ display:grid; grid-template-columns:1fr; gap:14px; }
@media (min-width:720px){ .grid{ grid-template-columns:1fr 1fr; } }
.field{ display:grid; gap:6px; font-size:.78rem; letter-spacing:.08em; text-transform:uppercase;
  font-family:var(--font-display); color:var(--teal); }
.field input,.field textarea,.image-field input[type="text"]{
  font-family:var(--font-body); font-size:1rem; letter-spacing:0; text-transform:none;
  background:#fff; border:1px solid var(--line); border-radius:4px; padding:11px 12px; width:100%; color:var(--ink); }
.field textarea{ min-height:110px; resize:vertical; }
.check{ display:flex; gap:10px; align-items:center; font-family:var(--font-body); text-transform:none;
  letter-spacing:0; font-size:.95rem; color:var(--ink); min-height:44px; }
.card{ background:var(--paper-2); border:1px solid var(--line); border-radius:var(--radius); padding:16px; margin:12px 0; }
.card-bar{ display:flex; justify-content:space-between; align-items:center; gap:12px; margin-bottom:12px; }
.card-bar strong{ font-family:var(--font-display); }
.tools{ display:flex; flex-wrap:wrap; gap:8px; }
.tools button,.add, .savebar button, .gate button{
  min-height:40px; padding:0 12px; border:1px solid var(--line); background:#fff; border-radius:4px;
  font-family:var(--font-display); font-size:.72rem; letter-spacing:.1em; text-transform:uppercase; }
.add{ margin-top:8px; }
.primary{ background:var(--dark) !important; color:var(--on-dark) !important; border-color:var(--dark) !important; }
.image-field{ display:grid; gap:8px; margin:12px 0; }
.image-label{ font-family:var(--font-display); font-size:.72rem; letter-spacing:.12em; text-transform:uppercase; color:var(--teal); }
.preview{ width:min(100%,360px); aspect-ratio:16/10; object-fit:cover; background:#d8ddd6; border-radius:8px; }
.hint{ font-size:.82rem; color:var(--ink-70); text-transform:none; letter-spacing:0; font-family:var(--font-body); }
.savebar{ position:fixed; left:0; right:0; bottom:0; z-index:30; background:var(--dark); color:var(--on-dark);
  display:flex; flex-wrap:wrap; gap:10px; align-items:center; padding:12px var(--pad); }
.savebar .status{ flex:1 1 220px; font-size:.85rem; color:rgba(233,231,226,.7); }
.savebar .status.err, .err{ color:#f0a48f; }
.savebar .dirty{ font-family:var(--font-display); letter-spacing:.12em; text-transform:uppercase; font-size:.68rem; color:#8fbab4; }
.gate{ max-width:480px; margin:12vh auto; padding:0 var(--pad); }
.gate h1{ font-family:var(--font-display); font-size:2.4rem; letter-spacing:-.03em; margin:8px 0 12px; }
.eyebrow{ font-family:var(--font-display); font-size:.72rem; letter-spacing:.22em; text-transform:uppercase; color:var(--teal); }
.gate form{ display:grid; gap:14px; margin-top:22px; }
</style>
</head>
<body>
<div id="app"></div>
<script src="js/cms.js"></script>
<script src="js/admin.js"></script>
</body>
</html>
