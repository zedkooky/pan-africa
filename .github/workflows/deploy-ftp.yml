name: Deploy Site via FTP

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ftp-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Stage public files only (no CMS, server, admin or working files)
        run: |
          mkdir site
          cp index.html team.html coverage.html brands.html contact.html enquiry.php PAD-Logo.png favicon.ico robots.txt sitemap.xml .htaccess site/
          cp -r assets icons site/
          rm -f site/assets/uploads -r
          mkdir site/js && cp js/cms.js site/js/
          # strip the editor PIN from the published content
          jq 'del(.settings)' content.json > site/content.json
          # the editor needs the Node server, which static hosting does not run
          sed -i '/class="foot-edit"/d' site/index.html site/team.html
          # canonical/OG/sitemap URLs default to https://panafricadistributors.com; set repo variable SITE_URL to override
          SITE="${{ vars.SITE_URL || 'https://panafricadistributors.com' }}"
          grep -rl 'https://panafricadistributors.com' site --include=*.html --include=*.xml --include=*.txt | xargs sed -i "s#https://panafricadistributors.com#${SITE%/}#g"
          find site -type f | sort

      - name: Deploy to FTP
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          server-dir: ${{ vars.FTP_SERVER_DIR || '/' }}
          local-dir: ./site/
          dangerous-clean-slate: false
